<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2a4a" />
  <title>萌寵推龍 · 倉庫番</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(160deg, #1b2a4a 0%, #2d1b4e 55%, #16324f 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      height: 100vh;
      height: 100dvh;
      padding-bottom: calc(50px + env(safe-area-inset-bottom));
      background-attachment: fixed;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      min-height: 100%;
      margin: 0 auto;
      padding: 10px 14px 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    select, button {
      font-family: inherit;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease, opacity 0.15s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button,
    .level-select {
      touch-action: manipulation;
    }

    .level-select {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      padding: 7px 12px;
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
      backdrop-filter: blur(6px);
    }

    .level-select option {
      background: #1e293b;
      color: #fff;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.72rem;
      color: #cbd5e1;
    }

    .stat-value {
      font-size: 1.02rem;
      font-weight: 800;
      color: #fde047;
      margin-top: 2px;
    }

    .board-wrapper {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 140px;
      background: rgba(10, 25, 47, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      touch-action: none;
      overflow: hidden;
    }

    canvas {
      display: block;
      border-radius: 12px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .status-toast {
      min-height: 22px;
      text-align: center;
      font-size: 0.85rem;
      color: #fde68a;
      font-weight: 600;
    }

    .controls-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .controls-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      padding: 9px 8px;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .btn-help {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #fff;
      padding: 9px 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .btn-autoundo {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff;
      padding: 9px 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .btn-adskip {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      padding: 9px 6px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 54px);
      gap: 6px;
      justify-content: center;
      margin-top: 2px;
    }

    .dpad-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .dpad-btn svg {
      pointer-events: none;
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }

    .dpad-btn:active {
      background: rgba(255, 255, 255, 0.34);
    }

    .level-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px;
      margin-top: -4px;
    }

    .level-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: #e2e8f0;
    }

    .difficulty-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      background: rgba(56, 189, 248, 0.18);
      color: #7dd3fc;
      border: 1px solid rgba(125, 211, 252, 0.35);
    }

    .difficulty-badge.medium {
      background: rgba(250, 204, 21, 0.16);
      color: #fde047;
      border-color: rgba(253, 224, 71, 0.38);
    }

    .difficulty-badge.hard {
      background: rgba(244, 114, 182, 0.16);
      color: #f9a8d4;
      border-color: rgba(249, 168, 212, 0.38);
    }

    .badge {
      display: inline-block;
      margin-left: 4px;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(0, 0, 0, 0.28);
      font-size: 0.66rem;
      font-weight: 700;
      vertical-align: middle;
      white-space: nowrap;
    }

    .badge.badge-ad {
      background: rgba(0, 0, 0, 0.32);
      color: #fef3c7;
    }

    .badge.is-empty {
      background: rgba(0, 0, 0, 0.34);
      color: #fca5a5;
    }

    .btn-secondary:active:not(:disabled),
    .btn-help:active:not(:disabled),
    .btn-autoundo:active:not(:disabled),
    .btn-adskip:active:not(:disabled) {
      filter: brightness(1.12);
    }

    .footer-stars {
      text-align: center;
      font-size: 0.82rem;
      color: #cbd5e1;
      padding-bottom: 4px;
    }

    .footer-stars strong {
      color: #fde047;
    }

    /* ---- ad banner (fixed, safe-area aware) ---- */
    .ad-banner {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      min-height: 50px;
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(6, 12, 26, 0.94);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ad-banner-inner {
      width: 100%;
      max-width: 480px;
      height: 48px;
      margin: 0 10px;
      border-radius: 8px;
      border: 1px dashed rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.76rem;
      letter-spacing: 1px;
      color: #94a3b8;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0 10px, transparent 10px 20px);
    }

    .ad-banner-inner::before {
      content: "AD";
      margin-right: 8px;
      font-size: 0.6rem;
      font-weight: 800;
      color: #64748b;
      border: 1px solid #475569;
      border-radius: 3px;
      padding: 0 3px;
    }

    /* ---- overlays ---- */
    .hidden {
      display: none !important;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(3, 8, 20, 0.74);
      backdrop-filter: blur(3px);
    }

    .modal {
      width: 100%;
      max-width: 360px;
      border-radius: 22px;
      padding: 22px 20px;
      text-align: center;
      background: linear-gradient(160deg, #1e2b52 0%, #2a1f4d 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.55);
    }

    .modal-emoji {
      font-size: 2.4rem;
      line-height: 1;
    }

    .modal h2 {
      margin: 8px 0 4px;
      font-size: 1.25rem;
      color: #fde047;
    }

    .stars-row {
      font-size: 1.7rem;
      letter-spacing: 4px;
      margin: 4px 0 6px;
      min-height: 28px;
    }

    .modal-text {
      margin: 4px 0;
      font-size: 0.9rem;
      color: #e2e8f0;
    }

    .modal-text.small {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .modal-actions {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      padding: 11px 10px;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 10px 10px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .modal .btn-secondary {
      padding: 10px;
      font-size: 0.9rem;
    }

    .sheet {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 540px;
      z-index: 55;
      padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #1b2747, #131c33);
      border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.45);
      animation: sheet-in 0.22s ease-out;
    }

    @keyframes sheet-in {
      from { transform: translate(-50%, 24px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .sheet-handle {
      width: 42px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.24);
      margin: 0 auto 10px;
    }

    .sheet-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: #fde047;
      text-align: center;
    }

    .sheet-text {
      margin: 6px 0 12px;
      text-align: center;
      font-size: 0.8rem;
      color: #cbd5e1;
    }

    .sheet-actions {
      display: grid;
      gap: 8px;
    }

    /* ---- mock ad player ---- */
    .ad-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: radial-gradient(circle at 50% 30%, #16224a, #070b16 70%);
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
    }

    .ad-visual {
      font-size: 3.6rem;
      filter: drop-shadow(0 8px 20px rgba(56, 189, 248, 0.35));
      animation: ad-pulse 1.6s ease-in-out infinite;
    }

    @keyframes ad-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .ad-title {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #7dd3fc;
    }

    .ad-timer {
      font-size: 1.6rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .ad-bar {
      width: min(320px, 74%);
      height: 8px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.14);
    }

    .ad-bar-inner {
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #38bdf8, #fbbf24);
      transition: width 0.25s linear;
    }

    .ad-close {
      margin-top: 6px;
      padding: 10px 22px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .ad-close:disabled {
      background: rgba(255, 255, 255, 0.12);
      color: #94a3b8;
    }

    .ad-note {
      font-size: 0.7rem;
      color: #64748b;
    }

    .float-toast {
      position: fixed;
      left: 50%;
      bottom: calc(96px + env(safe-area-inset-bottom));
      transform: translate(-50%, 10px);
      z-index: 70;
      max-width: 86%;
      padding: 9px 16px;
      border-radius: 99px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fef3c7;
      font-size: 0.82rem;
      font-weight: 600;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .float-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-height: 680px) {
      .title { font-size: 1.08rem; }
      .dpad { grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 46px); }
      .board-wrapper { padding: 6px; }
      .footer-stars { display: none; }
    }

    @media (max-height: 620px) {
      .app-container { gap: 6px; padding: 8px 12px 4px; }
      .status-toast { display: none; }
      .stats-bar { padding: 5px 8px; }
      .stat-value { font-size: 0.94rem; }
      .title { font-size: 1rem; }
      .btn-secondary, .btn-help, .btn-autoundo, .btn-adskip { padding: 7px 5px; }
      .dpad { grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 42px); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="title">🐲 萌寵推龍</div>
      <select id="levelSelect" class="level-select" aria-label="選擇關卡"></select>
    </header>

    <div class="level-banner">
      <span class="level-name" id="levelName">第 1 關</span>
      <span class="difficulty-badge" id="difficultyBadge">入門</span>
    </div>

    <div class="stats-bar">
      <div>
        <div class="stat-label">步數 / 標準</div>
        <div class="stat-value" id="statMoves">0 / 0</div>
      </div>
      <div>
        <div class="stat-label">最佳步數</div>
        <div class="stat-value" id="statBest">--</div>
      </div>
      <div>
        <div class="stat-label">星巢進度</div>
        <div class="stat-value" id="statNests">0 / 1</div>
      </div>
    </div>

    <div class="board-wrapper" id="boardWrapper">
      <canvas id="gameCanvas" aria-label="遊戲棋盤"></canvas>
    </div>

    <div class="status-toast" id="statusToast">用方向鍵、滑動或 D-Pad 推小龍回星巢</div>

    <div class="controls-row-3">
      <button class="btn-help" id="btnHelp">幫助<span class="badge" id="helpBadge">免費 1</span></button>
      <button class="btn-autoundo" id="btnAutoUndo">自動退一步<span class="badge" id="autoUndoBadge">免費 1</span></button>
      <button class="btn-adskip" id="btnAdSkip">看廣告過關<span class="badge badge-ad">廣告</span></button>
    </div>

    <div class="controls-row">
      <button class="btn-secondary" id="btnUndo">退一步</button>
      <button class="btn-secondary" id="btnReset">重設</button>
    </div>

    <div class="dpad">
      <button class="dpad-btn dpad-up" data-dir="U" aria-label="向上">▲</button>
      <button class="dpad-btn dpad-left" data-dir="L" aria-label="向左">◀</button>
      <button class="dpad-btn dpad-down" data-dir="D" aria-label="向下">▼</button>
      <button class="dpad-btn dpad-right" data-dir="R" aria-label="向右">▶</button>
    </div>

    <div class="footer-stars">⭐ <strong id="statStars">0</strong> 星星 · 🪙 <strong id="statCoins">0</strong> 金幣 · 已通關 <strong id="statCleared">0</strong>/<span id="statTotal">30</span></div>
  </div>

  <div class="ad-banner" id="adBanner">
    <div class="ad-banner-inner" id="adBannerInner">廣告 · 支持萌寵推龍</div>
  </div>

  <div class="modal-backdrop hidden" id="winModal">
    <div class="modal">
      <div class="modal-emoji" id="winEmoji">🌟</div>
      <h2 id="winTitle">過關！</h2>
      <div class="stars-row" id="winStars">⭐</div>
      <p class="modal-text" id="winSummary"></p>
      <p class="modal-text small" id="winBest"></p>
      <div class="modal-actions">
        <button class="btn-primary" id="btnNextLevel">下一關</button>
        <button class="btn-secondary" id="btnReplay">再玩一次</button>
        <button class="btn-ghost" id="btnOpenLevels">選擇關卡</button>
      </div>
    </div>
  </div>

  <div class="sheet hidden" id="stuckSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">卡關了嗎？🐣</div>
    <p class="sheet-text" id="stuckText">讓小嚮導給點提示，或自動退幾步重新想想。</p>
    <div class="sheet-actions">
      <button class="btn-help" id="stuckHelp">看廣告拿提示<span class="badge" id="stuckHelpBadge">免費 1</span></button>
      <button class="btn-autoundo" id="stuckUndo">自動退 5 步<span class="badge" id="stuckUndoBadge">免費 1</span></button>
      <button class="btn-ghost" id="stuckClose">繼續挑戰</button>
    </div>
  </div>

  <div class="ad-overlay hidden" id="adOverlay">
    <div class="ad-visual" id="adVisual">🎬</div>
    <div class="ad-title" id="adTitle">獎勵廣告</div>
    <div class="ad-timer" id="adTimer">3s</div>
    <div class="ad-bar"><div class="ad-bar-inner" id="adProgress"></div></div>
    <button class="ad-close" id="adClose" disabled>播放中…</button>
    <div class="ad-note">模擬廣告 · 正式版本由 AdMob 提供</div>
  </div>

  <div class="float-toast" id="floatToast"></div>

  <script src="src/config.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/solver.js"></script>
  <script src="src/services/adService.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
